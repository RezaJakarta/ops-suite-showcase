<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Agentic AI — Operations Autopilot</title>
  <desc id="d">Banner: sistem operasional bisnis nyaris autopilot dengan tim AI, SOP, KPI, dan persetujuan manusia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d1f"/><stop offset="0.55" stop-color="#0d2a66"/><stop offset="1" stop-color="#2447c9"/>
    </linearGradient>
    <linearGradient id="judul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cdcff"/><stop offset="1" stop-color="#c4a5ff"/>
    </linearGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#5cdcff"/><stop offset="1" stop-color="#7b5cf0"/>
    </radialGradient>
    <radialGradient id="cahaya" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5cdcff" stop-opacity="0.45"/><stop offset="1" stop-color="#5cdcff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5cdcff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="22" fill="url(#grid)"/>

  <!-- orb Midun di kanan -->
  <circle cx="1105" cy="175" r="150" fill="url(#cahaya)"/>
  <ellipse cx="1105" cy="175" rx="118" ry="34" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" transform="rotate(-18 1105 175)"/>
  <ellipse cx="1105" cy="175" rx="98" ry="28" fill="none" stroke="#c4a5ff" stroke-opacity="0.7" stroke-width="2" transform="rotate(24 1105 175)"/>
  <circle cx="1105" cy="175" r="62" fill="url(#orb)"/>
  <ellipse cx="1105" cy="300" rx="70" ry="12" fill="#000000" fill-opacity="0.25"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
    <text x="70" y="168" font-size="84" font-weight="800" letter-spacing="4" fill="url(#judul)">AGENTIC AI</text>
    <text x="76" y="222" font-size="36" font-weight="700" fill="#ffffff">AI Operations Autopilot</text>
    <text x="76" y="262" font-size="21" fill="#cfe3ff">Tim AI bekerja mengikuti SOP dan KPI. Manusia tetap memegang keputusan penting.</text>

    <g font-size="17" font-weight="600" fill="#e6f4ff">
      <rect x="76" y="302" width="188" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#5cdcff" stroke-opacity="0.5"/>
      <text x="170" y="328" text-anchor="middle">Kantor virtual AI</text>
      <rect x="276" y="302" width="276" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#5cdcff" stroke-opacity="0.5"/>
      <text x="414" y="328" text-anchor="middle">Karyawan AI + SOP dan KPI</text>
      <rect x="564" y="302" width="158" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#5cdcff" stroke-opacity="0.5"/>
      <text x="643" y="328" text-anchor="middle">Izin 3 tingkat</text>
      <rect x="734" y="302" width="162" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#5cdcff" stroke-opacity="0.5"/>
      <text x="815" y="328" text-anchor="middle">Asisten suara</text>
      <rect x="908" y="302" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#5cdcff" stroke-opacity="0.5"/>
      <text x="983" y="328" text-anchor="middle">Self-healing</text>
    </g>
  </g>
</svg>
