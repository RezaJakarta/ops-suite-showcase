<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">ARUS — Integrated Operations Platform</title>
  <desc id="d">Banner README: ERP, CRM, logistik, inventory, dan tracking indent dalam satu platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070f24"/>
      <stop offset="0.55" stop-color="#0b1b3f"/>
      <stop offset="1" stop-color="#1e3fb8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#5c86ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5c86ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fadff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fadff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fadff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#glow)"><animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/></rect>
  <g stroke="#ffffff" stroke-opacity="0.045">
    <path d="M0 90H1200M0 180H1200M0 270H1200M150 0V360M300 0V360M450 0V360M600 0V360M750 0V360M900 0V360M1050 0V360"/>
  </g>
  <!-- garis "arus" -->
  <path d="M-600 318 C -400 288, -200 348, 0 318 S 400 288, 600 318 S 1000 348, 1200 318 S 1600 288, 1800 318" fill="none" stroke="url(#wave)" stroke-width="2"><animateTransform attributeName="transform" type="translate" from="0 0" to="600 0" dur="9s" repeatCount="indefinite"/></path>
  <path d="M-600 334 C -400 304, -200 364, 0 334 S 400 304, 600 334 S 1000 364, 1200 334 S 1600 304, 1800 334" fill="none" stroke="url(#wave)" stroke-width="1" opacity="0.6"><animateTransform attributeName="transform" type="translate" from="0 0" to="600 0" dur="14s" repeatCount="indefinite"/></path>

  <!-- logo -->
  <rect x="72" y="70" width="100" height="100" rx="26" fill="#3366ff"/>
  <path d="M96 128c12-22 24-22 36 0s24 22 36 0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" transform="translate(-10 -8)"/>
  <path d="M96 128c12-22 24-22 36 0s24 22 36 0" fill="none" stroke="#bccfff" stroke-width="5" stroke-linecap="round" transform="translate(-10 14)" opacity="0.8"/>

  <text x="204" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="6" fill="#ffffff">ARUS</text>
  <text x="206" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#bccfff">Integrated Operations Platform</text>
  <text x="206" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#8fadff">ERP ringan di atas Google Workspace — dari permintaan sales sampai barang terkirim</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    <rect x="206" y="222" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
    <text x="258" y="244" text-anchor="middle">Inventory</text>
    <rect x="320" y="222" width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
    <text x="380" y="244" text-anchor="middle">Procurement</text>
    <rect x="450" y="222" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
    <text x="515" y="244" text-anchor="middle">Indent Tracking</text>
    <rect x="590" y="222" width="114" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
    <text x="647" y="244" text-anchor="middle">Sales &amp; CRM</text>
    <rect x="714" y="222" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
    <text x="770" y="244" text-anchor="middle">Marketplace</text>
    <rect x="836" y="222" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
    <text x="884" y="244" text-anchor="middle">Logistik</text>
    <rect x="942" y="222" width="112" height="34" rx="17" fill="#3366ff"/>
    <text x="998" y="244" text-anchor="middle">AI Agent</text>
  </g>
  <text x="206" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8fadff">19 aplikasi terintegrasi · 1 design system · ±140k baris kode</text>
</svg>
