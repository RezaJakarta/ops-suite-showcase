<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t">
  <title id="t">Modul ARUS</title>
  <style>
    .card { fill: #ffffff; stroke: #e4e7ec; }
    .ttl { font: 700 19px "Segoe UI", Arial, sans-serif; fill: #101828; }
    .txt { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #475467; }
    .tag { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #1d3fae; }
    .chip { fill: #eef3ff; }
    .ico { fill: none; stroke: #3366ff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="600" rx="20" fill="#f4f6f9"/>

  <!-- baris 1 -->
  <g transform="translate(20 20)">
    <rect class="card" width="276" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M32 38l12-6 12 6v16l-12 6-12-6zM32 38l12 6 12-6M44 44v16"/>
    <text class="ttl" x="20" y="102">Inventory &amp; Gudang</text>
    <text class="txt" x="20" y="130">Stok per gudang, barang</text>
    <text class="txt" x="20" y="150">masuk/keluar, performa produk</text>
    <text class="txt" x="20" y="170">(fast/slow moving, garansi)</text>
    <text class="txt" x="20" y="190">dan brankas audit.</text>
    <rect class="chip" x="20" y="222" width="86" height="26" rx="13"/><text class="tag" x="63" y="239" text-anchor="middle">Audit trail</text>
    <rect class="chip" x="114" y="222" width="98" height="26" rx="13"/><text class="tag" x="163" y="239" text-anchor="middle">Kartu stok</text>
  </g>
  <g transform="translate(316 20)">
    <rect class="card" width="276" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M35 33h-3v29h24V33h-3M38 30h12v6H38zM37 46l3 3 6-6M37 56h14"/>
    <text class="ttl" x="20" y="102">Procurement &amp; Indent</text>
    <text class="txt" x="20" y="130">Request PO dari sales, Purchase</text>
    <text class="txt" x="20" y="150">Order, Tracking Pesanan barang</text>
    <text class="txt" x="20" y="170">indent, dan rekomendasi</text>
    <text class="txt" x="20" y="190">Reorder Check.</text>
    <rect class="chip" x="20" y="222" width="96" height="26" rx="13"/><text class="tag" x="68" y="239" text-anchor="middle">Notif telat</text>
    <rect class="chip" x="124" y="222" width="90" height="26" rx="13"/><text class="tag" x="169" y="239" text-anchor="middle">Upload OA</text>
  </g>
  <g transform="translate(612 20)">
    <rect class="card" width="276" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M32 34h24v8H32zM32 46h11v14H32zM47 46h9v14h-9z"/>
    <text class="ttl" x="20" y="102">Sales &amp; Pricing</text>
    <text class="txt" x="20" y="130">Price list + kalkulator diskon,</text>
    <text class="txt" x="20" y="150">Set Builder, Compare produk,</text>
    <text class="txt" x="20" y="170">alternatif brand berbasis AI,</text>
    <text class="txt" x="20" y="190">dan penawaran harga.</text>
    <rect class="chip" x="20" y="222" width="94" height="26" rx="13"/><text class="tag" x="67" y="239" text-anchor="middle">Set Builder</text>
    <rect class="chip" x="122" y="222" width="74" height="26" rx="13"/><text class="tag" x="159" y="239" text-anchor="middle">Compare</text>
    <rect class="chip" x="204" y="222" width="52" height="26" rx="13"/><text class="tag" x="230" y="239" text-anchor="middle">Alt AI</text>
  </g>
  <g transform="translate(908 20)">
    <rect class="card" width="272" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M30 34h4l5 20h15l4-13H37M41 60a2 2 0 1 0 0.1 0M52 60a2 2 0 1 0 0.1 0"/>
    <text class="ttl" x="20" y="102">Marketplace</text>
    <text class="txt" x="20" y="130">Tokopedia &amp; Shopee dalam satu</text>
    <text class="txt" x="20" y="150">mesin: impor, edit, after fee,</text>
    <text class="txt" x="20" y="170">export, plus kalkulator</text>
    <text class="txt" x="20" y="190">harga marketplace.</text>
    <rect class="chip" x="20" y="222" width="80" height="26" rx="13"/><text class="tag" x="60" y="239" text-anchor="middle">After fee</text>
    <rect class="chip" x="108" y="222" width="92" height="26" rx="13"/><text class="tag" x="154" y="239" text-anchor="middle">Kalkulator</text>
  </g>

  <!-- baris 2 -->
  <g transform="translate(20 310)">
    <rect class="card" width="276" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M30 38h18v16H30zM48 42h7l5 6v6H48M36 58a3 3 0 1 0 0.1 0M54 58a3 3 0 1 0 0.1 0"/>
    <text class="ttl" x="20" y="102">Dokumen &amp; Logistik</text>
    <text class="txt" x="20" y="130">Surat Jalan (DO) dan SQ siap</text>
    <text class="txt" x="20" y="150">cetak, log dokumen, katalog</text>
    <text class="txt" x="20" y="170">PDF, legalitas, dan</text>
    <text class="txt" x="20" y="190">pengetahuan produk.</text>
    <rect class="chip" x="20" y="222" width="72" height="26" rx="13"/><text class="tag" x="56" y="239" text-anchor="middle">DO / SQ</text>
    <rect class="chip" x="100" y="222" width="84" height="26" rx="13"/><text class="tag" x="142" y="239" text-anchor="middle">Katalog</text>
  </g>
  <g transform="translate(316 310)">
    <rect class="card" width="276" height="270" rx="16" stroke="#3366ff" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#3366ff"/>
    <path d="M32 46a12 12 0 0 1 24 0v5M30 48h5v10h-5zM53 48h5v10h-5zM56 58q0 6-10 6" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="ttl" x="20" y="102">AI Agent "Midun"</text>
    <text class="txt" x="20" y="130">Terhubung ke data internal</text>
    <text class="txt" x="20" y="150">(40+ tool) dan sumber eksternal</text>
    <text class="txt" x="20" y="170">(web search, OCR). Punya memori,</text>
    <text class="txt" x="20" y="190">rapor &amp; ujian mingguan.</text>
    <rect class="chip" x="20" y="222" width="70" height="26" rx="13"/><text class="tag" x="55" y="239" text-anchor="middle">40+ tool</text>
    <rect class="chip" x="98" y="222" width="90" height="26" rx="13"/><text class="tag" x="143" y="239" text-anchor="middle">Web search</text>
    <rect class="chip" x="196" y="222" width="52" height="26" rx="13"/><text class="tag" x="222" y="239" text-anchor="middle">OCR</text>
  </g>
  <g transform="translate(612 310)">
    <rect class="card" width="276" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M32 60V34M32 60h26M38 54v-8M45 54V40M52 54v-11"/>
    <text class="ttl" x="20" y="102">Dashboard &amp; Analitik</text>
    <text class="txt" x="20" y="130">Ringkasan Inventory,</text>
    <text class="txt" x="20" y="150">Procurement, dan Marketplace</text>
    <text class="txt" x="20" y="170">dengan grafik + tabel, filter</text>
    <text class="txt" x="20" y="190">per gudang, brand, dan bulan.</text>
    <rect class="chip" x="20" y="222" width="70" height="26" rx="13"/><text class="tag" x="55" y="239" text-anchor="middle">Grafik</text>
    <rect class="chip" x="98" y="222" width="74" height="26" rx="13"/><text class="tag" x="135" y="239" text-anchor="middle">Omzet</text>
  </g>
  <g transform="translate(908 310)">
    <rect class="card" width="272" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M44 30l13 5v10c0 9-6 15-13 18-7-3-13-9-13-18V35zM38 46l4 4 8-8"/>
    <text class="ttl" x="20" y="102">Admin &amp; Keamanan</text>
    <text class="txt" x="20" y="130">Login Google, akses per menu,</text>
    <text class="txt" x="20" y="150">backup mingguan + pulihkan</text>
    <text class="txt" x="20" y="170">data, catatan error terpusat</text>
    <text class="txt" x="20" y="190">dirangkum AI tiap hari.</text>
    <rect class="chip" x="20" y="222" width="62" height="26" rx="13"/><text class="tag" x="51" y="239" text-anchor="middle">RBAC</text>
    <rect class="chip" x="90" y="222" width="72" height="26" rx="13"/><text class="tag" x="126" y="239" text-anchor="middle">Backup</text>
  </g>
</svg>
