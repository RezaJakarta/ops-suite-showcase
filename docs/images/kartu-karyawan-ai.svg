<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 964" role="img" aria-labelledby="t d">
  <title id="t">Kartu karyawan AI (contoh)</title>
  <desc id="d">Tiga kartu karyawan AI dari departemen berbeda: penjaga margin, analis toko, dan patroli kode — lengkap dengan peran, jadwal, dan KPI bersasaran. Semua angka adalah contoh fiktif.</desc>
  <defs>
    <linearGradient id="kepala" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10244f"/><stop offset="1" stop-color="#2447c9"/></linearGradient>
    <radialGradient id="avM" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#ffd166"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <radialGradient id="avT" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#5cdcff"/><stop offset="1" stop-color="#7b5cf0"/></radialGradient>
    <radialGradient id="avB" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/></radialGradient>
  </defs>
  <rect width="1100" height="964" rx="20" fill="#f4f7ff" stroke="#c9d6f5"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">

    <!-- ============ KARTU 1: MAYA ============ -->
    <g transform="translate(0,0)">
      <rect x="24" y="24" width="1052" height="272" rx="16" fill="#ffffff" stroke="#c9d6f5"/>
      <rect x="24" y="24" width="1052" height="78" rx="16" fill="url(#kepala)"/>
      <rect x="24" y="86" width="1052" height="16" fill="#ffffff"/>
      <circle cx="74" cy="63" r="27" fill="url(#avM)"/>
      <text x="74" y="72" text-anchor="middle" font-size="24" font-weight="800" fill="#10244f">M</text>
      <text x="118" y="56" font-size="22" font-weight="800" fill="#ffffff">Maya · Penjaga Margin</text>
      <text x="118" y="80" font-size="14" fill="#cfe3ff">Sales Marketing · gerbang untung-rugi sebelum harga tayang</text>
      <rect x="828" y="42" width="224" height="40" rx="20" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e"/>
      <circle cx="852" cy="62" r="6" fill="#22c55e"/>
      <text x="866" y="68" font-size="15" font-weight="700" fill="#e6ffef">terjadwal · Senin 11.00</text>

      <text x="48" y="130" font-size="12" font-weight="800" letter-spacing="1.5" fill="#3366ff">PERAN</text>
      <text x="48" y="153" font-size="15" fill="#10244f">Menjawab satu pertanyaan: "harga segini untung atau rugi?" — dihitung BERSIH setelah potongan nyata tiap kanal,</text>
      <text x="48" y="174" font-size="15" fill="#10244f">memakai tarif yang diverifikasi dari laporan keuangan resmi. Di bawah batas margin = berhenti di pemilik.</text>

      <rect x="48" y="190" width="1004" height="28" fill="#e3ebff"/>
      <g font-size="12" font-weight="700" fill="#44557a">
        <text x="60" y="209">KPI (SASARAN)</text><text x="640" y="209">Sasaran</text><text x="790" y="209">Frekuensi</text><text x="930" y="209">Hasil contoh</text>
      </g>
      <g font-size="14" fill="#10244f">
        <text x="60" y="240">Usulan harga melewati gerbang sebelum tayang</text><text x="640" y="240">100%</text><text x="790" y="240">Mingguan</text><text x="930" y="240" fill="#15803d" font-weight="700">100% ✓</text>
        <line x1="48" y1="250" x2="1052" y2="250" stroke="#c9d6f5"/>
        <text x="60" y="272">Listing tayang di bawah batas margin</text><text x="640" y="272">0</text><text x="790" y="272">Mingguan</text><text x="930" y="272" fill="#15803d" font-weight="700">0 ✓</text>
      </g>
    </g>

    <!-- ============ KARTU 2: TARA ============ -->
    <g transform="translate(0,296)">
      <rect x="24" y="24" width="1052" height="272" rx="16" fill="#ffffff" stroke="#c9d6f5"/>
      <rect x="24" y="24" width="1052" height="78" rx="16" fill="url(#kepala)"/>
      <rect x="24" y="86" width="1052" height="16" fill="#ffffff"/>
      <circle cx="74" cy="63" r="27" fill="url(#avT)"/>
      <text x="74" y="72" text-anchor="middle" font-size="24" font-weight="800" fill="#10244f">T</text>
      <text x="118" y="56" font-size="22" font-weight="800" fill="#ffffff">Tara · Analis Toko</text>
      <text x="118" y="80" font-size="14" fill="#cfe3ff">Sales Digital · pembedah angka penjualan tiap toko online</text>
      <rect x="828" y="42" width="224" height="40" rx="20" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e"/>
      <circle cx="852" cy="62" r="6" fill="#22c55e"/>
      <text x="866" y="68" font-size="15" font-weight="700" fill="#e6ffef">terjadwal · Senin 09.00</text>

      <text x="48" y="130" font-size="12" font-weight="800" letter-spacing="1.5" fill="#3366ff">PERAN</text>
      <text x="48" y="153" font-size="15" fill="#10244f">Membandingkan laju tiap toko dengan sasarannya, membedah toko yang melambat sampai ketemu produk</text>
      <text x="48" y="174" font-size="15" fill="#10244f">penyebabnya, lalu membuka kartu kerja untuk tim strategi. Setiap angka wajib menyebut sumbernya.</text>

      <rect x="48" y="190" width="1004" height="28" fill="#e3ebff"/>
      <g font-size="12" font-weight="700" fill="#44557a">
        <text x="60" y="209">KPI (SASARAN)</text><text x="640" y="209">Sasaran</text><text x="790" y="209">Frekuensi</text><text x="930" y="209">Hasil contoh</text>
      </g>
      <g font-size="14" fill="#10244f">
        <text x="60" y="240">Laporan mingguan terbit tepat waktu</text><text x="640" y="240">100%</text><text x="790" y="240">Mingguan</text><text x="930" y="240" fill="#15803d" font-weight="700">4/4 ✓</text>
        <line x1="48" y1="250" x2="1052" y2="250" stroke="#c9d6f5"/>
        <text x="60" y="272">Toko melambat terdeteksi ≤ 7 hari</text><text x="640" y="272">100%</text><text x="790" y="272">Bulanan</text><text x="930" y="272" fill="#15803d" font-weight="700">100% ✓</text>
      </g>
    </g>

    <!-- ============ KARTU 3: BAYU ============ -->
    <g transform="translate(0,592)">
      <rect x="24" y="24" width="1052" height="272" rx="16" fill="#ffffff" stroke="#c9d6f5"/>
      <rect x="24" y="24" width="1052" height="78" rx="16" fill="url(#kepala)"/>
      <rect x="24" y="86" width="1052" height="16" fill="#ffffff"/>
      <circle cx="74" cy="63" r="27" fill="url(#avB)"/>
      <text x="74" y="72" text-anchor="middle" font-size="24" font-weight="800" fill="#10244f">B</text>
      <text x="118" y="56" font-size="22" font-weight="800" fill="#ffffff">Bayu · Patroli Kode</text>
      <text x="118" y="80" font-size="14" fill="#cfe3ff">Teknologi &amp; Sistem · satpam pertama setiap minggu</text>
      <rect x="828" y="42" width="224" height="40" rx="20" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e"/>
      <circle cx="852" cy="62" r="6" fill="#22c55e"/>
      <text x="866" y="68" font-size="15" font-weight="700" fill="#e6ffef">terjadwal · Senin 06.30</text>

      <text x="48" y="130" font-size="12" font-weight="800" letter-spacing="1.5" fill="#3366ff">PERAN</text>
      <text x="48" y="153" font-size="15" fill="#10244f">Memeriksa kesehatan seluruh modul sistem sebelum jam kerja: pemeriksaan otomatis per modul, komponen</text>
      <text x="48" y="174" font-size="15" fill="#10244f">bersama yang harus identik, dan ringkasan perubahan kode dalam bahasa awam untuk pemilik.</text>

      <rect x="48" y="190" width="1004" height="28" fill="#e3ebff"/>
      <g font-size="12" font-weight="700" fill="#44557a">
        <text x="60" y="209">KPI (SASARAN)</text><text x="640" y="209">Sasaran</text><text x="790" y="209">Frekuensi</text><text x="930" y="209">Hasil contoh</text>
      </g>
      <g font-size="14" fill="#10244f">
        <text x="60" y="240">Seluruh modul lulus pemeriksaan</text><text x="640" y="240">100%</text><text x="790" y="240">Mingguan</text><text x="930" y="240" fill="#15803d" font-weight="700">22/22 ✓</text>
        <line x1="48" y1="250" x2="1052" y2="250" stroke="#c9d6f5"/>
        <text x="60" y="272">Patroli selesai sebelum jam kerja</text><text x="640" y="272">100%</text><text x="790" y="272">Mingguan</text><text x="930" y="272" fill="#15803d" font-weight="700">100% ✓</text>
      </g>
    </g>

    <text x="550" y="936" text-anchor="middle" font-size="13" fill="#5b6b8f">Tiga dari belasan karyawan AI pada sistem contoh. Semua nama dan angka di kartu ini adalah contoh fiktif untuk ilustrasi.</text>
  </g>
</svg>
