<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t">
  <title id="t">Kemampuan Midun</title>
  <style>
    .card { fill: #ffffff; stroke: #e4e7ec; }
    .ttl { font: 700 19px "Segoe UI", Arial, sans-serif; fill: #101828; }
    .txt { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #475467; }
    .q { font: italic 500 13px "Segoe UI", Arial, sans-serif; fill: #1d3fae; }
    .chip { fill: #eef3ff; }
    .ico { fill: none; stroke: #3366ff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="600" rx="20" fill="#f4f6f9"/>

  <g transform="translate(20 20)">
    <rect class="card" width="374" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M32 38l12-6 12 6v16l-12 6-12-6zM32 38l12 6 12-6M44 44v16"/>
    <text class="ttl" x="20" y="102">Stok, harga &amp; katalog</text>
    <text class="txt" x="20" y="130">Cek stok per gudang, harga price list,</text>
    <text class="txt" x="20" y="150">hitung diskon, cari katalog PDF, dan</text>
    <text class="txt" x="20" y="170">alternatif produk / brand.</text>
    <rect class="chip" x="20" y="206" width="334" height="44" rx="12"/>
    <text class="q" x="34" y="233">"stok MCB 3P 32A di semua gudang?"</text>
  </g>
  <g transform="translate(413 20)">
    <rect class="card" width="374" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M30 38h18v16H30zM48 42h7l5 6v6H48M36 58a3 3 0 1 0 0.1 0M54 58a3 3 0 1 0 0.1 0"/>
    <text class="ttl" x="20" y="102">Indent, PO &amp; gudang</text>
    <text class="txt" x="20" y="130">Status PO, indent yang telat atau segera</text>
    <text class="txt" x="20" y="150">tiba, Request PO, dan permintaan</text>
    <text class="txt" x="20" y="170">barang gudang.</text>
    <rect class="chip" x="20" y="206" width="334" height="44" rx="12"/>
    <text class="q" x="34" y="233">"indent mana yang telat minggu ini?"</text>
  </g>
  <g transform="translate(806 20)">
    <rect class="card" width="374" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M32 60V34M32 60h26M38 54v-8M45 54V40M52 54v-11"/>
    <text class="ttl" x="20" y="102">Analisa penjualan</text>
    <text class="txt" x="20" y="130">Pergerakan produk, ranking, banding</text>
    <text class="txt" x="20" y="150">periode, ABC, reorder point, prediksi,</text>
    <text class="txt" x="20" y="170">dan deteksi anomali.</text>
    <rect class="chip" x="20" y="206" width="334" height="44" rx="12"/>
    <text class="q" x="34" y="233">"top 10 produk bulan ini vs bulan lalu"</text>
  </g>

  <g transform="translate(20 310)">
    <rect class="card" width="374" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M30 34h4l5 20h15l4-13H37M41 60a2 2 0 1 0 0.1 0M52 60a2 2 0 1 0 0.1 0"/>
    <text class="ttl" x="20" y="102">Marketplace</text>
    <text class="txt" x="20" y="130">Omzet, produk terlaris, profit, pelanggan,</text>
    <text class="txt" x="20" y="150">banding Tokopedia vs Shopee, dan</text>
    <text class="txt" x="20" y="170">lacak pesanan.</text>
    <rect class="chip" x="20" y="206" width="334" height="44" rx="12"/>
    <text class="q" x="34" y="233">"omzet Shopee vs Tokopedia Oktober"</text>
  </g>
  <g transform="translate(413 310)">
    <rect class="card" width="374" height="270" rx="16"/>
    <rect class="chip" x="20" y="20" width="48" height="48" rx="12"/>
    <path class="ico" d="M44 30a14 14 0 1 0 0.1 0M30 44h28M44 30q-8 14 0 28M44 30q8 14 0 28"/>
    <text class="ttl" x="20" y="102">Sumber eksternal</text>
    <text class="txt" x="20" y="130">Web search untuk info di luar sistem,</text>
    <text class="txt" x="20" y="150">OCR untuk membaca foto dokumen</text>
    <text class="txt" x="20" y="170">atau nameplate produk.</text>
    <rect class="chip" x="20" y="206" width="334" height="44" rx="12"/>
    <text class="q" x="34" y="233">"baca foto nameplate ini"</text>
  </g>
  <g transform="translate(806 310)">
    <rect class="card" width="374" height="270" rx="16" stroke="#3366ff" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#3366ff"/>
    <path d="M44 30l13 5v10c0 9-6 15-13 18-7-3-13-9-13-18V35zM38 46l4 4 8-8" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="ttl" x="20" y="102">Belajar &amp; terpantau</text>
    <text class="txt" x="20" y="130">Memori percakapan per pengguna, rapor</text>
    <text class="txt" x="20" y="150">dan ujian mingguan, serta rangkuman</text>
    <text class="txt" x="20" y="170">error sistem untuk pemilik.</text>
    <rect class="chip" x="20" y="206" width="334" height="44" rx="12"/>
    <text class="q" x="34" y="233">"ada error apa kemarin?"</text>
  </g>
</svg>
